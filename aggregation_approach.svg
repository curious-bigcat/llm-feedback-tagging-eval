<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" font-family="Helvetica, Arial, sans-serif">
  <rect width="1600" height="1180" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA8B5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#11567F">How we tested building the report from tagged feedback</text>
  <text x="800" y="104" text-anchor="middle" font-size="21" fill="#5B6B7A">Everything runs in Snowflake (database VOC_EVAL) · numbers by SQL, words by AI · every report scored</text>

  <!-- Row labels -->
  <g font-size="15" font-weight="700" fill="#8A97A3" letter-spacing="2">
    <text x="20" y="480" transform="rotate(-90 20 480)" text-anchor="middle">LOGIC</text>
    <text x="20" y="790" transform="rotate(-90 20 790)" text-anchor="middle">IN SNOWFLAKE</text>
  </g>

  <!-- Header cards -->
  <g>
    <!-- A1 Slice -->
    <rect x="40" y="140" width="236" height="230" rx="18" fill="#EAF7FD" stroke="#29B5E8" stroke-width="2.5"/>
    <circle cx="158" cy="176" r="22" fill="#29B5E8"/>
    <text x="158" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">A1</text>
    <text x="158" y="232" text-anchor="middle" font-size="26" font-weight="700" fill="#11567F">Report slice</text>
    <text x="158" y="300" text-anchor="middle" font-size="40" font-weight="700" fill="#29B5E8">500</text>
    <text x="158" y="330" text-anchor="middle" font-size="16" fill="#5B6B7A">patient transport comments</text>

    <!-- A2 Tag -->
    <rect x="296" y="140" width="236" height="230" rx="18" fill="#EAF7FD" stroke="#29B5E8" stroke-width="2.5"/>
    <circle cx="414" cy="176" r="22" fill="#29B5E8"/>
    <text x="414" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">A2</text>
    <text x="414" y="232" text-anchor="middle" font-size="26" font-weight="700" fill="#11567F">Tag twice</text>
    <text x="414" y="300" text-anchor="middle" font-size="36" font-weight="700" fill="#29B5E8">669 / 1,050</text>
    <text x="414" y="330" text-anchor="middle" font-size="16" fill="#5B6B7A">tags: winner / today</text>

    <!-- A3 Count -->
    <rect x="552" y="140" width="236" height="230" rx="18" fill="#EAF7FD" stroke="#29B5E8" stroke-width="2.5"/>
    <circle cx="670" cy="176" r="22" fill="#29B5E8"/>
    <text x="670" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">A3</text>
    <text x="670" y="232" text-anchor="middle" font-size="26" font-weight="700" fill="#11567F">Count</text>
    <text x="670" y="300" text-anchor="middle" font-size="40" font-weight="700" fill="#29B5E8">0 diffs</text>
    <text x="670" y="330" text-anchor="middle" font-size="16" fill="#5B6B7A">semantic view vs plain SQL</text>

    <!-- A4 Write -->
    <rect x="808" y="140" width="236" height="230" rx="18" fill="#EAF7FD" stroke="#29B5E8" stroke-width="2.5"/>
    <circle cx="926" cy="176" r="22" fill="#29B5E8"/>
    <text x="926" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">A4</text>
    <text x="926" y="232" text-anchor="middle" font-size="26" font-weight="700" fill="#11567F">Write text</text>
    <text x="926" y="300" text-anchor="middle" font-size="40" font-weight="700" fill="#29B5E8">18</text>
    <text x="926" y="330" text-anchor="middle" font-size="16" fill="#5B6B7A">reports: 3 methods × 2 × 3</text>

    <!-- A5 Score -->
    <rect x="1064" y="140" width="236" height="230" rx="18" fill="#EAF7FD" stroke="#29B5E8" stroke-width="2.5"/>
    <circle cx="1182" cy="176" r="22" fill="#29B5E8"/>
    <text x="1182" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">A5</text>
    <text x="1182" y="232" text-anchor="middle" font-size="26" font-weight="700" fill="#11567F">Score</text>
    <text x="1182" y="300" text-anchor="middle" font-size="40" font-weight="700" fill="#29B5E8">218</text>
    <text x="1182" y="330" text-anchor="middle" font-size="16" fill="#5B6B7A">sections judged</text>

    <!-- A6 Decision -->
    <rect x="1320" y="140" width="236" height="230" rx="18" fill="#EAF6EF" stroke="#2E9E5B" stroke-width="3"/>
    <circle cx="1438" cy="176" r="22" fill="#2E9E5B"/>
    <text x="1438" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">A6</text>
    <text x="1438" y="232" text-anchor="middle" font-size="26" font-weight="700" fill="#1E6E3F">Decision</text>
    <text x="1438" y="290" text-anchor="middle" font-size="25" font-weight="700" fill="#2E9E5B">Semantic view</text>
    <text x="1438" y="322" text-anchor="middle" font-size="25" font-weight="700" fill="#2E9E5B">+ map-reduce</text>
  </g>

  <!-- Arrows between header cards -->
  <g stroke="#9AA8B5" stroke-width="3" marker-end="url(#arrow)">
    <line x1="278" y1="255" x2="292" y2="255"/>
    <line x1="534" y1="255" x2="548" y2="255"/>
    <line x1="790" y1="255" x2="804" y2="255"/>
    <line x1="1046" y1="255" x2="1060" y2="255"/>
    <line x1="1302" y1="255" x2="1316" y2="255"/>
  </g>

  <!-- ===== LOGIC panels ===== -->
  <g fill="#FFFFFF" stroke="#D5DCE3" stroke-width="1.5">
    <rect x="40" y="390" width="236" height="250" rx="14"/>
    <rect x="296" y="390" width="236" height="250" rx="14"/>
    <rect x="552" y="390" width="236" height="250" rx="14"/>
    <rect x="808" y="390" width="236" height="250" rx="14"/>
    <rect x="1064" y="390" width="236" height="250" rx="14"/>
    <rect x="1320" y="390" width="236" height="250" rx="14"/>
  </g>
  <g font-size="16" fill="#2B3A47">
    <!-- A1 -->
    <text x="56" y="420">• One service, like one</text>
    <text x="56" y="440">  report: patient transport</text>
    <text x="56" y="468">• 500 of its 1,423 comments,</text>
    <text x="56" y="488">  fixed random pick</text>
    <text x="56" y="516">• Both survey questions:</text>
    <text x="56" y="536">  "why this rating?" and</text>
    <text x="56" y="556">  "how could we improve?"</text>
    <text x="56" y="596" fill="#5B6B7A">All themes, not one topic</text>
    <!-- A2 -->
    <text x="312" y="420">• Winner (Gemini 3.1 Pro,</text>
    <text x="312" y="440">  v3 prompt) and today's</text>
    <text x="312" y="460">  setup each tag all 500</text>
    <text x="312" y="488">• Winner: 1.3 tags each,</text>
    <text x="312" y="508">  all 500 valid first time</text>
    <text x="312" y="536">• Today: 2.1 tags each,</text>
    <text x="312" y="556">  34 still invalid</text>
    <text x="312" y="596" fill="#5B6B7A">Shows what bad tags do</text>
    <!-- A3 -->
    <text x="568" y="420">• The AI never counts</text>
    <text x="568" y="448">• Comments per theme,</text>
    <text x="568" y="468">  % negative / positive,</text>
    <text x="568" y="488">  impact: defined once</text>
    <text x="568" y="516">• Each comment counted</text>
    <text x="568" y="536">  once per theme</text>
    <text x="568" y="564">• Today's tags inflate every</text>
    <text x="568" y="584">  theme: Communication 60</text>
    <text x="568" y="604">  vs 20 comments</text>
    <!-- A4 -->
    <text x="824" y="420">Same instruction, no</text>
    <text x="824" y="440">numbers in the text:</text>
    <text x="824" y="468">• One big prompt: all</text>
    <text x="824" y="488">  comments, one call</text>
    <text x="824" y="516">• Map-reduce: one call per</text>
    <text x="824" y="536">  theme, then the overview</text>
    <text x="824" y="564">• AI_AGG per theme</text>
    <text x="824" y="596" fill="#5B6B7A">On both tag sets, 3 runs</text>
    <!-- A5 -->
    <text x="1080" y="420">• Faithful: is every claim</text>
    <text x="1080" y="440">  backed by the comments?</text>
    <text x="1080" y="468">• Coverage: top sub-themes</text>
    <text x="1080" y="488">  mentioned?</text>
    <text x="1080" y="516">• Consistent: same points</text>
    <text x="1080" y="536">  in all 3 runs?</text>
    <text x="1080" y="564">• Quotes word for word,</text>
    <text x="1080" y="584">  no numbers (free SQL)</text>
    <text x="1080" y="616" fill="#5B6B7A">Judge is not a writer</text>
    <!-- A6 -->
    <text x="1336" y="420">• Numbers from the</text>
    <text x="1336" y="440">  semantic view</text>
    <text x="1336" y="468">• Text by map-reduce</text>
    <text x="1336" y="496">• On the winner's tags</text>
    <text x="1336" y="532" fill="#5B6B7A">Next: scale test, then</text>
    <text x="1336" y="552" fill="#5B6B7A">every service and annual</text>
    <text x="1336" y="572" fill="#5B6B7A">reports by map-reduce of</text>
    <text x="1336" y="592" fill="#5B6B7A">service sections</text>
  </g>

  <!-- ===== IN SNOWFLAKE panels ===== -->
  <g fill="#F7FBFE" stroke="#BFE6F7" stroke-width="1.5">
    <rect x="40" y="660" width="236" height="270" rx="14"/>
    <rect x="296" y="660" width="236" height="270" rx="14"/>
    <rect x="552" y="660" width="236" height="270" rx="14"/>
    <rect x="808" y="660" width="236" height="270" rx="14"/>
    <rect x="1064" y="660" width="236" height="270" rx="14"/>
    <rect x="1320" y="660" width="236" height="270" rx="14"/>
  </g>
  <g font-size="16" fill="#2B3A47">
    <!-- A1 -->
    <text x="56" y="692">SQL, fixed hash (SHA2),</text>
    <text x="56" y="712">no AI</text>
    <text x="56" y="740" font-family="Menlo, monospace" font-size="15" fill="#11567F">REPORT_COMMENTS</text>
    <text x="56" y="774" fill="#5B6B7A">sql/report.sql</text>
    <!-- A2 -->
    <text x="312" y="692">The tagging procedure</text>
    <text x="312" y="712">with a new source:</text>
    <text x="312" y="740" font-family="Menlo, monospace" font-size="14" fill="#11567F">RUN_MODEL(..., 'REPORT_</text>
    <text x="312" y="760" font-family="Menlo, monospace" font-size="14" fill="#11567F">COMMENTS')</text>
    <text x="312" y="788" font-family="Menlo, monospace" font-size="15" fill="#11567F">ANSWERS</text>
    <text x="312" y="822" font-weight="700" fill="#11567F">Models</text>
    <text x="312" y="844">Gemini 3.1 Pro (winner)</text>
    <text x="312" y="864">Mistral Large 3 (today)</text>
    <!-- A3 -->
    <text x="568" y="692">JSON answers flattened</text>
    <text x="568" y="712">into two tables:</text>
    <text x="568" y="740" font-family="Menlo, monospace" font-size="15" fill="#11567F">REPORT_ANSWERS</text>
    <text x="568" y="762" font-family="Menlo, monospace" font-size="15" fill="#11567F">REPORT_TAGS</text>
    <text x="568" y="794">Semantic view:</text>
    <text x="568" y="816" font-family="Menlo, monospace" font-size="15" fill="#11567F">REPORT_SV</text>
    <text x="568" y="848" fill="#5B6B7A">sql/report_tags.sql</text>
    <text x="568" y="868" fill="#5B6B7A">sql/report_sv.sql</text>
    <!-- A4 -->
    <text x="824" y="692">Procedure</text>
    <text x="824" y="714" font-family="Menlo, monospace" font-size="15" fill="#11567F">RUN_SUMMARY</text>
    <text x="824" y="742">AI_COMPLETE (Gemini 3.1</text>
    <text x="824" y="762">Pro) and AI_AGG; 18 runs</text>
    <text x="824" y="782">in parallel as tasks</text>
    <text x="824" y="810" font-family="Menlo, monospace" font-size="15" fill="#11567F">REPORT_SUMMARIES</text>
    <text x="824" y="844" fill="#5B6B7A">sql/summaries.sql</text>
    <text x="824" y="864" fill="#5B6B7A">prompts/summary_v2.txt</text>
    <!-- A5 -->
    <text x="1080" y="692">AI_COMPLETE batch,</text>
    <text x="1080" y="712">JSON verdicts</text>
    <text x="1080" y="740" font-family="Menlo, monospace" font-size="15" fill="#11567F">REPORT_JUDGE</text>
    <text x="1080" y="762" font-family="Menlo, monospace" font-size="15" fill="#11567F">REPORT_CONSISTENCY</text>
    <text x="1080" y="784" font-family="Menlo, monospace" font-size="15" fill="#11567F">REPORT_SCORES</text>
    <text x="1080" y="818" font-weight="700" fill="#11567F">Judge model</text>
    <text x="1080" y="840">Claude Sonnet 4.6</text>
    <text x="1080" y="872" fill="#5B6B7A">sql/report_scores.sql</text>
    <!-- A6 -->
    <text x="1336" y="692">Example finished report:</text>
    <text x="1336" y="714" font-family="Menlo, monospace" font-size="14" fill="#11567F">reports/patient_</text>
    <text x="1336" y="734" font-family="Menlo, monospace" font-size="14" fill="#11567F">transport_report.md</text>
    <text x="1336" y="762">Written up in</text>
    <text x="1336" y="782">decision_report.md §7</text>
    <text x="1336" y="824" font-weight="700" fill="#11567F">Report test cost</text>
    <text x="1336" y="846">≈ 15-20 credits</text>
  </g>

  <!-- ===== Bottom: methods on the winner's tags ===== -->
  <rect x="40" y="955" width="1516" height="190" rx="18" fill="#F4F6F8"/>
  <text x="70" y="998" font-size="23" font-weight="700" fill="#11567F">Three ways to write the text (winner's tags)</text>
  <g font-size="20" fill="#2B3A47">
    <text x="580" y="998" font-weight="700" fill="#5B6B7A">Faithful</text>
    <text x="800" y="998" font-weight="700" fill="#5B6B7A">Coverage</text>
    <text x="1030" y="998" font-weight="700" fill="#5B6B7A">Same points 3×</text>
    <text x="1270" y="998" font-weight="700" fill="#5B6B7A">Quotes exact</text>

    <text x="70" y="1038">One big prompt (today's method)</text>
    <text x="580" y="1038">0.91</text>
    <text x="800" y="1038">0.78</text>
    <text x="1030" y="1038">0.54</text>
    <text x="1270" y="1038">100%</text>

    <text x="70" y="1074">AI_AGG per theme</text>
    <text x="580" y="1074">0.94</text>
    <text x="800" y="1074">0.67</text>
    <text x="1030" y="1074">0.49</text>
    <text x="1270" y="1074">87%</text>

    <text x="70" y="1110" font-weight="700" fill="#2E9E5B">Map-reduce (winner)</text>
    <text x="580" y="1110" font-weight="700" fill="#2E9E5B">0.98</text>
    <text x="800" y="1110" font-weight="700" fill="#2E9E5B">0.85</text>
    <text x="1030" y="1110" font-weight="700" fill="#2E9E5B">0.74</text>
    <text x="1270" y="1110" font-weight="700" fill="#2E9E5B">99%</text>
  </g>
  <text x="800" y="1168" text-anchor="middle" font-size="16" fill="#8A97A3">Same writer (Gemini 3.1 Pro) and instruction for every method; on today's tags every method scores lower</text>
</svg>
